[project]
name = "amp_push"
version = "0.1.0"
description = "A small, dependency-light client for pushing metrics to AWS Managed Prometheus (AMP) via SigV4-signed Prometheus remote_write."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3",
    "cramjam",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "protobuf",
    "click",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amp_push"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
