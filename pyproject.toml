[project]
name = "amp_push"
version = "0.1.1"
description = "A small, dependency-light client for pushing metrics to AWS Managed Prometheus (AMP) via SigV4-signed Prometheus remote_write."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Phil Hendren", email = "phil@phonl.io" },
]
maintainers = [
    { name = "Phil Hendren", email = "phil@phonl.io" },
]
keywords = ["prometheus", "aws", "amp", "metrics", "remote-write", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "boto3",
    "cramjam",
    "requests",
]

[project.urls]
Homepage = "https://github.com/philhendren/amp_push"
Repository = "https://github.com/philhendren/amp_push"
Documentation = "https://amp-push.readthedocs.io/"
Issues = "https://github.com/philhendren/amp_push/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "protobuf",
    "click",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amp_push"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
